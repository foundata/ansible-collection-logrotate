---

minor_changes:
  - >
    ``run`` - Added the ``run_logrotate_service_state`` parameter
    (``enabled``/``disabled``/``running``/``unmanaged``, default ``enabled``) to
    explicitly manage the enablement and run state of the systemd
    ``logrotate.timer``. Previously the role relied on the timer's vendor preset
    and provided no way to disable it or leave it unmanaged.
