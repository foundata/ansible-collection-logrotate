# Check collection role "run" outcomes.

- name: "Molecule | Verify | Initialize the foundata.logrotate.run role (without actually running it; get and expose variables)"
  ansible.builtin.include_role:
    name: "foundata.logrotate.run"
    tasks_from: "init"
    public: true


## Preparation

- name: "Molecule | Verify | Set run_logrotate_* and __testing_* variables as facts from __testing_state"
  ansible.builtin.set_fact:
    "{{ item['key'] }}": "{{ item['value'] }}"
  loop: >-
    {{
      (__testing_state | ansible.builtin.default({}, true))
      | ansible.builtin.dict2items
      | ansible.builtin.selectattr('key', 'ansible.builtin.match', '^(run_logrotate_|__testing_)')
      | ansible.builtin.list
    }}


- name: "Molecule | Verify | Set other expected or needed facts"
  ansible.builtin.set_fact:
    __testing_section_dropin_file_path: "{{ __run_logrotate_config_dropin_dir_path }}/foo_bar"
    __testing_systemctl_exec_path: "/usr/bin/systemctl"


## Defaults drop-in file

- name: "Molecule | Verify | Check if logrotate drop-in config file (logrotate defaults) exists"
  ansible.builtin.stat:
    path: "{{ __run_logrotate_config_defaults_dropin_file_path }}"
  register: __testing_dropin_file


- name: "Molecule | Verify | Assert logrotate drop-in config file (logrotate defaults) exists"
  ansible.builtin.assert:
    that:
      - __testing_dropin_file['stat']['exists']
    fail_msg: >-
      The logrotate drop-in config file (logrotate defaults)
      '{{ __run_logrotate_config_defaults_dropin_file_path }}'
      does not exist.
    success_msg: >-
      The logrotate drop-in config file (logrotate defaults)
      '{{ __run_logrotate_config_defaults_dropin_file_path }}'
      exists.


- name: "Molecule | Verify | Check if default logrotate drop-in config file (logrotate defaults) does exists (if custom filename is used)"
  ansible.builtin.stat:
    path: "{{ __run_logrotate_config_defaults_dropin_file_path_default }}"
  when:
    - __run_logrotate_config_defaults_dropin_file_path != __run_logrotate_config_defaults_dropin_file_path_default
  register: __testing_dropin_file_default


- name: "Molecule | Verify | Assert default logrotate drop-in config file (logrotate defaults) does not exists (if custom filename is used)"
  ansible.builtin.assert:
    that:
      - __testing_dropin_file_default['stat']['exists'] is ansible.builtin.false
    fail_msg: >-
      The default logrotate drop-in config file (logrotate defaults)
      '{{ __run_logrotate_config_defaults_dropin_file_path_default }}'
      exists (even though a custom filename is used).
    success_msg: >-
      The default logrotate drop-in config file (logrotate defaults)
      '{{ __run_logrotate_config_defaults_dropin_file_path_default }}'
      does not exist (valid as custom filename is used).
  when:
    - __run_logrotate_config_defaults_dropin_file_path != __run_logrotate_config_defaults_dropin_file_path_default


## Custom drop-in file

- name: "Molecule | Verify | Check if section drop-in config file exists"
  ansible.builtin.stat:
    path: "{{ __testing_section_dropin_file_path }}"
  register: __testing_section_dropin_file


- name: "Molecule | Verify | Assert section drop-in config file exists"
  ansible.builtin.assert:
    that:
      - __testing_section_dropin_file['stat']['exists']
    fail_msg: >-
      The section drop-in config file '{{ __testing_section_dropin_file_path }}' does not exist.
    success_msg: >-
      The section drop-in config file '{{ __testing_section_dropin_file_path }}' exists.


- name: "Molecule | Verify | Read section drop-in config file content"
  ansible.builtin.slurp:
    src: "{{ __testing_section_dropin_file_path }}"
  register: __testing_section_dropin_content


- name: "Molecule | Verify | Set section drop-in config file content as fact"
  ansible.builtin.set_fact:
    __testing_section_dropin_decoded: >-
      {{ __testing_section_dropin_content['content'] | ansible.builtin.b64decode }}


- name: "Molecule | Verify | Assert section drop-in contains unquoted path (no spaces)"
  ansible.builtin.assert:
    that:
      - "'/var/log/news/*' in __testing_section_dropin_decoded"
    fail_msg: >-
      The section drop-in config file does not contain the expected unquoted path '/var/log/news/*'.
    success_msg: >-
      The section drop-in config file contains the expected unquoted path '/var/log/news/*'.


- name: "Molecule | Verify | Assert section drop-in contains quoted path (with spaces, glob preserved)"
  ansible.builtin.assert:
    that:
      - >-
        '"/var/log/news with spaces/"*"/foo/"*".log"'
        in __testing_section_dropin_decoded
    fail_msg: >-
      The section drop-in config file does not contain the expected quoted path
      '"/var/log/news with spaces/"*"/foo/"*".log"'.
      Actual content: {{ __testing_section_dropin_decoded }}
    success_msg: >-
      The section drop-in config file contains the expected quoted path with preserved glob characters.


- name: "Molecule | Verify | Assert section drop-in contains expected directives"
  ansible.builtin.assert:
    that:
      - "'nocompress' in __testing_section_dropin_decoded"
      - "'rotate 2' in __testing_section_dropin_decoded"
      - "'supressed' not in __testing_section_dropin_decoded"
    fail_msg: >-
      The section drop-in config file is missing expected directives or contains suppressed ones.
      Actual content: {{ __testing_section_dropin_decoded }}
    success_msg: >-
      The section drop-in config file contains expected directives and correctly omits false-valued ones.


- name: "Molecule | Verify | Assert section drop-in contains prerotate script block"
  ansible.builtin.assert:
    that:
      - "'prerotate' in __testing_section_dropin_decoded"
      - "'/usr/bin/killall -HUP foo1' in __testing_section_dropin_decoded"
      - "'/usr/bin/killall -HUP bar2' in __testing_section_dropin_decoded"
      - "'endscript' in __testing_section_dropin_decoded"
    fail_msg: >-
      The section drop-in config file does not contain the expected prerotate script block.
      Actual content: {{ __testing_section_dropin_decoded }}
    success_msg: >-
      The section drop-in config file contains the expected prerotate script block.


- name: "Molecule | Verify | Validate section drop-in config file syntax (dry-run)"
  ansible.builtin.command:
    argv:
      - "{{ __run_logrotate_logrotate_exec_path }}"
      - "--debug"
      - "{{ __testing_section_dropin_file_path }}"
  register: __testing_section_logrotate_validation
  changed_when: false
  failed_when:
    - __testing_section_logrotate_validation is ansible.builtin.failed


- name: "Molecule | Verify | Assert section drop-in config file syntax is valid"
  ansible.builtin.assert:
    that:
      - __testing_section_logrotate_validation is ansible.builtin.success
    fail_msg: >-
      The section drop-in config file '{{ __testing_section_dropin_file_path }}' has invalid syntax.
      Output: {{ __testing_section_logrotate_validation['stderr'] | ansible.builtin.default('') }}
    success_msg: >-
      The section drop-in config file '{{ __testing_section_dropin_file_path }}' has valid syntax.


## Logrotate configuration validation

- name: "Molecule | Verify | Validate logrotate configuration (dry-run)"
  ansible.builtin.command:
    argv:
      - "{{ __run_logrotate_logrotate_exec_path }}"
      - "--debug"
      - "--verbose"
      - "{{ __run_logrotate_config_file_path }}"
  register: __testing_logrotate_validation_result
  changed_when:
    - false
  failed_when:
    - __testing_logrotate_validation_result is ansible.builtin.failed


- name: "Molecule | Verify | Assert logrotate configuration is valid"
  ansible.builtin.assert:
    that:
      - __testing_logrotate_validation_result is ansible.builtin.success
    fail_msg: >-
      The logrotate configuration '{{ __run_logrotate_config_defaults_dropin_file_path }}'
      is invalid. Output: {{ __testing_logrotate_validation_result['stderr'] | ansible.builtin.default('') }}
    success_msg: >-
      The logrotate configuration '{{ __run_logrotate_config_defaults_dropin_file_path }}'
      is valid.


## Reaping of stale role-created files (integration)
#
# Files whose keys were renamed or removed are identified by the ownership
# marker line and removed by the role; files without the marker are never
# touched. Plant a marker-bearing orphan plus a hand-made decoy without the
# marker in the drop-in directory, re-run the role with the converge settings
# and assert only the orphan is gone while the declared section and defaults
# drop-in files survive.

- name: "Molecule | Verify | Validate reaping of stale role-created files (integration)"
  vars:
    __testing_stale_section_path: "{{ __run_logrotate_config_dropin_dir_path }}/molecule-stale-section"
    __testing_decoy_section_path: "{{ __run_logrotate_config_dropin_dir_path }}/molecule-admin-section"
  block:

    - name: "Molecule | Verify | Plant a stale marker-bearing file and a hand-made decoy"
      ansible.builtin.copy:
        content: "{{ item['content'] }}"
        dest: "{{ item['dest'] }}"
        owner: "root"
        group: "root"
        mode: "u=rw,g=r,o=r" # 0644
      loop:
        - dest: "{{ __testing_stale_section_path }}"
          content: |
            {{ __run_logrotate_config_file_marker }}
            /var/log/molecule-test-stale.log {
              missingok
              rotate 1
            }
        - dest: "{{ __testing_decoy_section_path }}"
          content: |
            /var/log/molecule-test-decoy.log {
              missingok
              rotate 1
            }
      loop_control:
        label: "{{ item['dest'] }}"

    - name: "Molecule | Verify | Re-run the foundata.logrotate.run role"
      ansible.builtin.include_role:
        name: "foundata.logrotate.run"

    - name: "Molecule | Verify | Flush the handlers notified by the cleanup"
      ansible.builtin.meta: flush_handlers

    - name: "Molecule | Verify | Get the status of the planted and declared files after the re-run"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: __testing_reap_stat
      loop:
        - "{{ __testing_stale_section_path }}"
        - "{{ __testing_decoy_section_path }}"
        - "{{ __testing_section_dropin_file_path }}"
        - "{{ __run_logrotate_config_defaults_dropin_file_path }}"

    - name: "Molecule | Verify | Assert only the stale marker-bearing file was removed"
      ansible.builtin.assert:
        that:
          - not __testing_reap_stat['results'][0]['stat']['exists']
          - __testing_reap_stat['results'][1]['stat']['exists']
          - __testing_reap_stat['results'][2]['stat']['exists']
          - __testing_reap_stat['results'][3]['stat']['exists']
        fail_msg: >-
          The role did not reap exactly the stale marker-bearing file:
          {{ __testing_reap_stat['results'] | ansible.builtin.map(attribute='stat.exists') | ansible.builtin.list }}
          for {{ __testing_reap_stat['results'] | ansible.builtin.map(attribute='item') | ansible.builtin.list }}
          (expected [false, true, true, true]).
        success_msg: >-
          The role removed the stale marker-bearing file and left the hand-made
          decoy and the declared drop-in files untouched.

  always:

    - name: "Molecule | Verify | Remove the planted files again"
      ansible.builtin.file:
        path: "{{ item }}"
        state: "absent"
      loop:
        - "{{ __testing_stale_section_path }}"
        - "{{ __testing_decoy_section_path }}"


## systemd timer

- name: "Molecule | Verify | Fail on unsupported service manager for timer configuration"
  ansible.builtin.fail:
    msg: >-
      Timer management is only supported with systemd as service manager.
      The current service manager '{{ ansible_facts['service_mgr'] }}' is not supported.
  when:
    - (ansible_facts['service_mgr'] | ansible.builtin.lower) != 'systemd'


- name: "Molecule | Verify | systemd timer"
  when:
    - (ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'
  block:

    - name: "Molecule | Verify | Set expected systemd timer parameters as facts (from __testing_state, with sensible defaults)"
      ansible.builtin.set_fact:
        __testing_systemd_timer_unit_name: "{{ __run_logrotate_systemd_timer_unit_name }}"
        __testing_systemd_timer_unit_dropin_file_path: "{{ __run_logrotate_systemd_timer_unit_dropin_file_path }}"


    - name: "Molecule | Verify | Gather systemd unit files (JSON)"
      ansible.builtin.command:
        argv:
          - "{{ __testing_systemctl_exec_path }}"
          - "list-unit-files"
          - "--all"
          - "--output=json"
      register: __testing_systemd_unit_files_json
      changed_when:
        - false
      failed_when:
        - __testing_systemd_unit_files_json is ansible.builtin.failed


    - name: "Molecule | Verify | Build systemd_facts (list of unit_file names)"
      ansible.builtin.set_fact:
        __testing_systemd_facts: >-
          {{
            __testing_systemd_unit_files_json['stdout']
            | ansible.builtin.from_json
            | ansible.builtin.map(attribute='unit_file')
            | ansible.builtin.list
          }}


    - name: "Molecule | Verify | Show systemd_facts"
      ansible.builtin.debug:
        var: __testing_systemd_facts
        verbosity: 3


    - name: "Molecule | Verify | Assert timer existence expectation (systemd_facts)"
      ansible.builtin.assert:
        that:
          - (__testing_systemd_timer_unit_name in __testing_systemd_facts) == true
        fail_msg: >-
          Timer presence mismatch for '{{ __testing_systemd_timer_unit_name }}'.
          expect_present=true
          present={{ __testing_systemd_timer_unit_name in __testing_systemd_facts }}
        success_msg: >-
          Timer presence expectation matched for '{{ __testing_systemd_timer_unit_name }}'
          (expect_present=true).


    - name: "Molecule | Verify | Check timer active state (systemctl is-active)"
      ansible.builtin.command:
        argv:
          - "{{ __testing_systemctl_exec_path }}"
          - "is-active"
          - "{{ __testing_systemd_timer_unit_name }}"
      register: __testing_timer_is_active
      changed_when:
        - false
      failed_when:
        - __testing_timer_is_active is ansible.builtin.failed
        - __testing_timer_is_active['rc'] != 3 # inactive, installed but not running (not an error)


    - name: "Molecule | Verify | Check timer enabled state (systemctl is-enabled)"
      ansible.builtin.command:
        argv:
          - "{{ __testing_systemctl_exec_path }}"
          - "is-enabled"
          - "{{ __testing_systemd_timer_unit_name }}"
      register: __testing_timer_is_enabled
      changed_when:
        - false
      failed_when:
        - __testing_timer_is_enabled is ansible.builtin.failed


    - name: "Molecule | Verify | Assert timer is in expected active/enabled states"
      ansible.builtin.assert:
        that:
          - (__testing_timer_is_enabled['stdout'] | ansible.builtin.trim) == 'enabled'
        fail_msg: >-
          Timer '{{ __testing_systemd_timer_unit_name }}' is not in expected state.
          is-enabled: '{{ __testing_timer_is_enabled['stdout'] | ansible.builtin.trim }}' (rc={{ __testing_timer_is_enabled['rc'] }}, expected 'enabled')
        success_msg: >-
          Timer '{{ __testing_systemd_timer_unit_name }}' is 'enabled'.


    ## systemd timer drop-in file

    - name: "Molecule | Verify | Check if systemd timer drop-in config file exists"
      ansible.builtin.stat:
        path: "{{ __testing_systemd_timer_unit_dropin_file_path }}"
      register: __testing_systemd_timer_unit_dropin_file


    - name: "Molecule | Verify | Assert systemd timer drop-in config file exists"
      ansible.builtin.assert:
        that:
          - __testing_systemd_timer_unit_dropin_file['stat']['exists']
        fail_msg: >-
          The systemd timer drop-in config file '{{ __testing_systemd_timer_unit_dropin_file_path }}' does not exist.
        success_msg: >-
          The systemd timer drop-in config file '{{ __testing_systemd_timer_unit_dropin_file_path }}' exists.


    - name: "Molecule | Verify | Read systemd timer drop-in config file content"
      ansible.builtin.slurp:
        src: "{{ __testing_systemd_timer_unit_dropin_file_path }}"
      register: __testing_systemd_timer_unit_dropin_content


    - name: "Molecule | Verify | Set systemd timer drop-in config file content as fact"
      ansible.builtin.set_fact:
        __testing_systemd_timer_unit_dropin_decoded: >-
          {{ __testing_systemd_timer_unit_dropin_content['content'] | ansible.builtin.b64decode }}


    - name: "Molecule | Verify | Assert systemd timer drop-in contains expected directives"
      ansible.builtin.assert:
        that:
          - "'OnCalendar=hourly' in __testing_systemd_timer_unit_dropin_decoded"
          - "'RandomizedDelaySec=30m' in __testing_systemd_timer_unit_dropin_decoded"
          - "'Persistent=false' in __testing_systemd_timer_unit_dropin_decoded"
        fail_msg: >-
          The systemd timer drop-in config file is missing expected directives.
          Actual content: {{ __testing_systemd_timer_unit_dropin_decoded }}
        success_msg: >-
          The systemd timer drop-in config file contains expected directives.

    # The repeatable time-trigger directives share one list in systemd, so the
    # drop-in must carry
    # exactly ONE empty reset line: a second one would wipe the triggers rendered
    # before it. The two configured OnCalendar values must therefore appear as two
    # assignments after that single reset.
    - name: "Molecule | Verify | Assert the timer drop-in carries exactly one trigger reset"
      ansible.builtin.assert:
        that:
          - >-
            (__testing_systemd_timer_unit_dropin_decoded | ansible.builtin.regex_findall('(?m)^OnCalendar=$')
             | ansible.builtin.length) == 1
          - >-
            (__testing_systemd_timer_unit_dropin_decoded | ansible.builtin.regex_findall('(?m)^OnCalendar=.+$')
             | ansible.builtin.length) == 2
        fail_msg: >-
          The rendered timer drop-in must contain exactly one empty 'OnCalendar=' reset line
          followed by the two configured expressions.
          Actual content: {{ __testing_systemd_timer_unit_dropin_decoded }}
        success_msg: >-
          The rendered timer drop-in carries exactly one trigger reset followed by both
          configured OnCalendar expressions.


    ## systemctl cat contents (prove all was reloaded and parsed)

    # Example content:
    #   $ systemctl cat logrotate.timer
    #
    #   # /usr/lib/systemd/system/logrotate.timer
    #   [Unit]
    #   Description=Daily rotation of log files
    #   Documentation=man:logrotate(8) man:logrotate.conf(5)
    #
    #   [Timer]
    #   OnCalendar=daily
    #   RandomizedDelaySec=1h
    #   Persistent=true
    #
    #   [Install]
    #   WantedBy=timers.target
    #
    #   # /etc/systemd/system/logrotate.timer.d/dropin.conf
    #   # Ansible managed
    #   [Timer]
    #   OnCalendar=daily
    #   RandomizedDelaySec=1h
    #   Persistent=true
    #
    # Example warnings:
    #   Warning: logrotate.timer changed on disk, the version systemd has loaded is outdated.
    #   Failed to cat /etc/systemd/system/logrotate.timer.d/dropin.conf: No such file or directory

    - name: "Molecule | Verify | Gather systemd logrotate.timer config"
      ansible.builtin.command:
        argv:
          - "{{ __testing_systemctl_exec_path }}"
          - "cat"
          - "{{ __testing_systemd_timer_unit_name }}"
      register: __testing_systemd_timer_unit_validation
      changed_when: false
      failed_when:
        - __testing_systemd_timer_unit_validation is ansible.builtin.failed


    - name: "Molecule | Verify | Assert systemd timer drop-in contains expected directives"
      ansible.builtin.assert:
        that:
          - "__testing_systemd_timer_unit_dropin_file_path in  __testing_systemd_timer_unit_validation['stdout']"
          - "'OnCalendar=hourly' in __testing_systemd_timer_unit_validation['stdout']"
          - "'RandomizedDelaySec=30m' in __testing_systemd_timer_unit_validation['stdout']"
          - "'Persistent=false' in __testing_systemd_timer_unit_validation['stdout']"
          - "'Warning' not in __testing_systemd_timer_unit_validation['stdout']"
          - "'Failed' not in __testing_systemd_timer_unit_validation['stdout']"
        fail_msg: >-
          The systemd timer config is missing expected directives or produces warnings/errors.
          Actual content: {{ __testing_systemd_timer_unit_validation['stdout'] }}
        success_msg: >-
          The systemd timer config file contains expected directives and produces no warnings/errors.


    # "systemctl cat" only concatenates the unit and its drop-ins, so it still
    # shows the vendor schedule next to the managed one and cannot prove which
    # schedule is in effect. List-typed directives such as OnCalendar accumulate
    # across a unit and its drop-ins, and the vendor logrotate.timer ships
    # "OnCalendar=daily". Without the reset line the drop-in emits (see
    # templates/systemd_timer.conf.j2), the configured schedule would be added
    # to the vendor one instead of replacing it, so logrotate would keep
    # rotating daily on top of the requested schedule. Query the effective
    # schedule systemd actually computed and assert it consists of exactly the
    # configured entries.
    - name: "Molecule | Verify | Get the effective calendar schedule of the logrotate timer"
      ansible.builtin.command:
        argv:
          - "{{ __testing_systemctl_exec_path }}"
          - "show"
          - "--property=TimersCalendar"
          - "--property=TimersMonotonic"
          - "--property=OnClockChange"
          - "{{ __testing_systemd_timer_unit_name }}"
      register: __testing_systemd_timer_calendar
      changed_when: false


    - name: "Molecule | Verify | Assert the timer drop-in replaces the vendor schedule instead of accumulating"
      ansible.builtin.assert:
        that:
          # "hourly" normalizes to "*-*-* *:00:00" in the effective schedule
          - "'*-*-* *:00:00' in __testing_systemd_timer_calendar['stdout']"
          # the vendor "daily" schedule must be gone, not merely outranked
          - "'*-*-* 00:00:00' not in __testing_systemd_timer_calendar['stdout']"
          - "'05:00:00' in __testing_systemd_timer_calendar['stdout']"
          # both configured expressions, and nothing from the vendor unit
          - >-
            (__testing_systemd_timer_calendar['stdout']
             | ansible.builtin.regex_findall('OnCalendar=')
             | ansible.builtin.length) == 2
          # the configured monotonic trigger must survive next to the calendar one
          - "'OnActiveUSec=1w' in __testing_systemd_timer_calendar['stdout']"
          # the boolean event trigger must be effective as well
          - "'OnClockChange=yes' in __testing_systemd_timer_calendar['stdout']"
        fail_msg: >-
          The effective timer schedule does not consist of exactly the configured OnCalendar entries.
          The vendor schedule is most likely accumulating with the managed one.
          Actual: {{ __testing_systemd_timer_calendar['stdout'] }}
        success_msg: >-
          The effective timer schedule consists of exactly the configured OnCalendar entries
          ({{ __testing_systemd_timer_calendar['stdout'] | ansible.builtin.trim }}).


## Init-only merged variable evaluation
#
# Re-run the role's init with controlled inputs and assert the merged timer
# settings directly (whether materialized in tasks/init.yml or lazily in
# vars/main.yml): a user value must win, the untouched defaults must survive,
# and a user-only key must be added.
#
# Inputs are set via set_fact so they outrank the converge-time facts restored
# at the top of this file and stay in scope when the assertion dereferences the
# (lazily evaluated) effective variable.

- name: "Molecule | Verify | Validate effective timer settings merge (init-only)"
  block:

    - name: "Molecule | Verify | Set custom timer settings for the merge check"
      ansible.builtin.set_fact:
        run_logrotate_timer_settings:
          RandomizedDelaySec: "13m"
          FooDirective: "bar"


    - name: "Molecule | Verify | Re-initialize logrotate with custom timer settings"
      ansible.builtin.include_role:
        name: "foundata.logrotate.run"
        tasks_from: "init"
        public: true


    - name: "Molecule | Verify | Assert effective timer settings merged correctly"
      ansible.builtin.assert:
        that:
          - __run_logrotate_effective_timer_settings['RandomizedDelaySec'] == "13m"
          - __run_logrotate_effective_timer_settings['OnCalendar'] == "daily"
          - __run_logrotate_effective_timer_settings['Persistent'] | ansible.builtin.bool
          - __run_logrotate_effective_timer_settings['FooDirective'] == "bar"
        fail_msg: "__run_logrotate_effective_timer_settings did not merge defaults and user values as expected."
        success_msg: "__run_logrotate_effective_timer_settings merged defaults and user values correctly."


## Timer settings validation (init-only)
#
# The init tasks must reject timer settings the templates cannot render into a
# valid unit, and an empty list must be the supported way to drop a built-in
# trigger default. Each rejection case runs the role's init with one invalid
# mapping and expects the run to fail inside the validation; the positive case
# proves the empty-list removal is accepted and reaches the effective settings.

- name: "Molecule | Verify | Run timer settings rejection checks (init-only)"
  ansible.builtin.include_tasks:
    file: >-
      {{ (lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY')
          | ansible.builtin.default('../../default')) }}/tasks/verify/checks/timer-settings-reject.yml
  vars:
    __testing_reject_case: "{{ item }}"
  loop:
    - label: "empty string trigger"
      varname: "run_logrotate_timer_settings"
      settings:
        OnCalendar: ""
    - label: "invalid list member"
      varname: "run_logrotate_timer_settings"
      settings:
        OnCalendar:
          - "daily"
          - true
    - label: "list for non-repeatable directive"
      varname: "run_logrotate_timer_settings"
      settings:
        RandomizedDelaySec:
          - "30m"
    - label: "mapping for non-repeatable directive"
      varname: "run_logrotate_timer_settings"
      settings:
        RandomizedDelaySec:
          bad: "value"
    - label: "no trigger left"
      varname: "run_logrotate_timer_settings"
      settings:
        OnCalendar: []
    - label: "non-boolean event trigger"
      varname: "run_logrotate_timer_settings"
      settings:
        OnClockChange: "true"
    - label: "event triggers false and no other trigger"
      varname: "run_logrotate_timer_settings"
      settings:
        OnCalendar: []
        OnClockChange: false
        OnTimezoneChange: false
  loop_control:
    label: "{{ item['label'] }}"


- name: "Molecule | Verify | Timer settings: apply an empty-list removal with a monotonic trigger"
  ansible.builtin.set_fact:
    __testing_timer_settings_saved: "{{ run_logrotate_timer_settings | ansible.builtin.default({}) }}"
    run_logrotate_timer_settings:
      OnCalendar: []
      OnBootSec: "10min"


- name: "Molecule | Verify | Timer settings: include the role's init (must accept the removal)"
  ansible.builtin.include_role:
    name: "foundata.logrotate.run"
    tasks_from: "init"


- name: "Molecule | Verify | Timer settings: assert the removal reached the effective settings"
  ansible.builtin.assert:
    that:
      - (__run_logrotate_effective_timer_settings['OnCalendar'] | ansible.builtin.length) == 0
      - "__run_logrotate_effective_timer_settings['OnBootSec'] == '10min'"
    fail_msg: >-
      The empty-list removal did not reach the effective timer settings.
      Got: {{ __run_logrotate_effective_timer_settings }}
    success_msg: >-
      An empty OnCalendar list drops the built-in default while the monotonic
      trigger remains.


- name: "Molecule | Verify | Timer settings: restore the saved settings"
  ansible.builtin.set_fact:
    run_logrotate_timer_settings: "{{ __testing_timer_settings_saved }}"


- name: "Molecule | Verify | Timer settings: apply an event-only configuration"
  ansible.builtin.set_fact:
    __testing_timer_settings_saved: "{{ run_logrotate_timer_settings | ansible.builtin.default({}) }}"
    run_logrotate_timer_settings:
      OnCalendar: []
      OnClockChange: true


- name: "Molecule | Verify | Timer settings: include the role's init (must accept the event-only timer)"
  ansible.builtin.include_role:
    name: "foundata.logrotate.run"
    tasks_from: "init"


- name: "Molecule | Verify | Timer settings: assert the event-only configuration reached the effective settings"
  ansible.builtin.assert:
    that:
      - (__run_logrotate_effective_timer_settings['OnCalendar'] | ansible.builtin.length) == 0
      - __run_logrotate_effective_timer_settings['OnClockChange'] | ansible.builtin.bool
    fail_msg: >-
      The event-only timer configuration did not reach the effective settings.
      Got: {{ __run_logrotate_effective_timer_settings }}
    success_msg: >-
      An event-only timer (all repeatable triggers dropped, OnClockChange true)
      is accepted.


- name: "Molecule | Verify | Timer settings: restore the saved settings again"
  ansible.builtin.set_fact:
    run_logrotate_timer_settings: "{{ __testing_timer_settings_saved }}"


## Timer settings: event-only timer applied to the system (integration)
#
# The init-only positive case above proves acceptance, but not the rendered
# result. Re-run the role with an event-only configuration and ask systemd:
# the drop-in must carry the single reset and nothing else next to the event
# trigger, and the unit must end up with empty calendar/monotonic trigger
# lists while OnClockChange is active. This is the path that would regress if
# the reset detection stopped counting event triggers.

- name: "Molecule | Verify | Timer settings | event-only integration: save the current settings"
  ansible.builtin.set_fact:
    __testing_timer_settings_saved: "{{ run_logrotate_timer_settings | ansible.builtin.default({}) }}"
    run_logrotate_timer_settings:
      OnCalendar: []
      OnClockChange: true


- name: "Molecule | Verify | Timer settings | event-only integration: apply the role"
  ansible.builtin.include_role:
    name: "foundata.logrotate.run"


- name: "Molecule | Verify | Timer settings | event-only integration: run pending handlers (daemon-reload)"
  ansible.builtin.meta: flush_handlers


- name: "Molecule | Verify | Timer settings | event-only integration: read the rendered drop-in"
  ansible.builtin.slurp:
    src: "{{ __run_logrotate_systemd_timer_unit_dropin_file_path }}"
  register: __testing_timer_eventonly_dropin


- name: "Molecule | Verify | Timer settings | event-only integration: assert the rendered drop-in"
  vars:
    __testing_timer_eventonly_decoded: "{{ __testing_timer_eventonly_dropin['content'] | ansible.builtin.b64decode }}"
  ansible.builtin.assert:
    that:
      # exactly the single shared reset, no calendar or monotonic assignment
      - >-
        (__testing_timer_eventonly_decoded
         | ansible.builtin.regex_findall('(?m)^OnCalendar=$') | ansible.builtin.length) == 1
      - >-
        (__testing_timer_eventonly_decoded
         | ansible.builtin.regex_findall('(?m)^On\w+=.+$')
         | ansible.builtin.reject('match', '^OnClockChange=')
         | ansible.builtin.list | ansible.builtin.length) == 0
      - "'OnClockChange=true' in __testing_timer_eventonly_decoded"
    fail_msg: >-
      The event-only drop-in must contain exactly one empty 'OnCalendar=' reset and the
      event trigger, nothing else. Actual content: {{ __testing_timer_eventonly_decoded }}
    success_msg: "The event-only drop-in carries the single reset and the event trigger."


- name: "Molecule | Verify | Timer settings | event-only integration: get the parsed unit properties"
  ansible.builtin.command:
    argv:
      - "systemctl"
      - "show"
      - "--property=TimersCalendar"
      - "--property=TimersMonotonic"
      - "--property=OnClockChange"
      - "{{ __run_logrotate_systemd_timer_unit_name }}"
  register: __testing_timer_eventonly_props
  changed_when:
    - false


- name: "Molecule | Verify | Timer settings | event-only integration: assert the effective unit state"
  ansible.builtin.assert:
    that:
      # Both trigger lists must be empty: the reset removed the vendor schedule.
      # "systemctl show" omits empty properties unless --all is given, so assert
      # the absence of the non-empty form ("TimersCalendar={ ... }"), which is
      # robust across systemd versions.
      - "'TimersCalendar={' not in __testing_timer_eventonly_props['stdout']"
      - "'TimersMonotonic={' not in __testing_timer_eventonly_props['stdout']"
      - "'OnClockChange=yes' in __testing_timer_eventonly_props['stdout']"
    fail_msg: >-
      The event-only timer does not have the expected effective state (empty trigger
      lists, active OnClockChange). Got: {{ __testing_timer_eventonly_props['stdout'] }}
    success_msg: "The event-only timer is effective: empty trigger lists, OnClockChange active."


- name: "Molecule | Verify | Timer settings | event-only integration: restore the saved settings"
  ansible.builtin.set_fact:
    run_logrotate_timer_settings: "{{ __testing_timer_settings_saved }}"


- name: "Molecule | Verify | Timer settings | event-only integration: re-apply the role with the restored settings"
  ansible.builtin.include_role:
    name: "foundata.logrotate.run"


- name: "Molecule | Verify | Timer settings | event-only integration: run pending handlers again"
  ansible.builtin.meta: flush_handlers


## Timer settings: triggerless settings accepted while the timer is unmanaged
#
# The "keeps at least one trigger" check mirrors the conditions under which the
# config tasks manage the timer. Prove the mirroring: with run_logrotate_timer_manage set to false
# the same triggerless settings that are rejected above must pass init.

- name: "Molecule | Verify | Timer settings | unmanaged: save the current settings and flags"
  ansible.builtin.set_fact:
    __testing_timer_settings_saved: "{{ run_logrotate_timer_settings | ansible.builtin.default({}) }}"
    __testing_timer_manage_saved: "{{ run_logrotate_timer_manage | ansible.builtin.default(true) }}"
    run_logrotate_timer_settings:
      OnCalendar: []
    run_logrotate_timer_manage: false


- name: "Molecule | Verify | Timer settings | unmanaged: include the role's init (must accept triggerless settings)"
  ansible.builtin.include_role:
    name: "foundata.logrotate.run"
    tasks_from: "init"


- name: "Molecule | Verify | Timer settings | unmanaged: assert the triggerless settings were in effect"
  ansible.builtin.assert:
    that:
      - (__run_logrotate_effective_timer_settings['OnCalendar'] | ansible.builtin.length) == 0
    fail_msg: >-
      The triggerless settings were not in effect during the init run, the acceptance
      is vacuous. Got: {{ __run_logrotate_effective_timer_settings }}
    success_msg: >-
      Triggerless settings pass init while the timer is not managed, so the trigger
      check mirrors the management conditions.


- name: "Molecule | Verify | Timer settings | unmanaged: restore the saved settings and flags"
  ansible.builtin.set_fact:
    run_logrotate_timer_settings: "{{ __testing_timer_settings_saved }}"
    run_logrotate_timer_manage: "{{ __testing_timer_manage_saved }}"

## Timer settings: triggerless settings accepted on a non-systemd service manager
#
# The unmanaged case above disables run_logrotate_timer_manage, a condition the
# trigger check carried from the start. The service-manager condition is the
# newly mirrored one, so it needs its own case: with timer management still
# enabled, a non-systemd service manager alone must make the triggerless
# settings pass. Passing ansible_facts as an include variable shadows the magic
# mapping for that include only, so the real gathered facts stay untouched and
# nothing needs restoring.

- name: "Molecule | Verify | Timer settings | non-systemd: save the settings and build the fact override"
  ansible.builtin.set_fact:
    __testing_timer_settings_saved: "{{ run_logrotate_timer_settings | ansible.builtin.default({}) }}"
    __testing_facts_override: "{{ ansible_facts | ansible.builtin.combine({'service_mgr': 'openrc'}) }}"
    run_logrotate_timer_settings:
      OnCalendar: []


- name: "Molecule | Verify | Timer settings | non-systemd: include the role's init (must accept triggerless settings)"
  ansible.builtin.include_role:
    name: "foundata.logrotate.run"
    tasks_from: "init"
  vars:
    ansible_facts: "{{ __testing_facts_override }}"


- name: "Molecule | Verify | Timer settings | non-systemd: assert the triggerless settings were in effect"
  ansible.builtin.assert:
    that:
      - (__run_logrotate_effective_timer_settings['OnCalendar'] | ansible.builtin.length) == 0
    fail_msg: >-
      The triggerless settings were not in effect during the init run, the acceptance
      is vacuous. Got: {{ __run_logrotate_effective_timer_settings }}
    success_msg: >-
      Triggerless settings pass init on a non-systemd service manager, so the trigger
      check mirrors the management conditions.


- name: "Molecule | Verify | Timer settings | non-systemd: restore the saved settings"
  ansible.builtin.set_fact:
    run_logrotate_timer_settings: "{{ __testing_timer_settings_saved }}"


## Reduced fact sets: init must gather service_mgr itself
#
# The config tasks gate the whole timer handling on
# ansible_facts['service_mgr']. That fact is part of ansible's implicit "min"
# collection, so any plain gather brings it along - but a play using
# "!all,!min,distribution" has distribution facts without it, and the role's
# conditional gather used to skip in that case because its used-facts mapping
# did not list service_mgr. Reconstruct exactly that situation and prove the
# init closes the gap. Kept as the last check in this file: clear_facts only
# removes gathered facts (set_fact helpers such as __testing_state survive it),
# but any later task relying on gathered facts would have to re-gather them.

- name: "Molecule | Verify | Reduced facts: clear the gathered facts of the host"
  ansible.builtin.meta: clear_facts


- name: "Molecule | Verify | Reduced facts: gather distribution facts only (no min set)"
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - "distribution"


- name: "Molecule | Verify | Reduced facts: assert service_mgr is not known yet"
  ansible.builtin.assert:
    that:
      - "'service_mgr' not in ansible_facts"
    fail_msg: >-
      ansible_facts['service_mgr'] is already present after a distribution-only
      gather, so this check cannot prove anything. Adjust the gather_subset.
    success_msg: "service_mgr is absent after a distribution-only gather."


- name: "Molecule | Verify | Reduced facts: include the role's init"
  ansible.builtin.include_role:
    name: "foundata.logrotate.run"
    tasks_from: "init"


- name: "Molecule | Verify | Reduced facts: assert the role gathered service_mgr itself"
  ansible.builtin.assert:
    that:
      - "'service_mgr' in ansible_facts"
      - "(ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'"
    fail_msg: >-
      The role's init did not gather ansible_facts['service_mgr'] although the config
      tasks gate on it. Under reduced fact sets the timer handling would fail.
    success_msg: "The role's init gathers service_mgr itself under reduced fact sets."


## Uninstall (state "absent") verification
#
# This block stays the LAST one in the verify stage: it converges the
# instances away from the state every earlier check relies on. It is
# deliberately not part of the cleanup stage - cleanup also runs when an
# earlier stage fails (on arbitrary state) and has to stay assertion-free.

# Simulate a drop-in whose name can no longer be derived from the current
# variables (a section renamed or de-listed since deployment). It carries
# the role's ownership marker, so the uninstall has to find it via the
# marker sweep of the drop-in directory.
- name: "Molecule | Verify | Uninstall: plant a historical role-managed drop-in"
  ansible.builtin.copy:
    dest: "/etc/logrotate.d/renamed-historical"
    content: |
      # Managed by Ansible (foundata.logrotate.run)
      /var/log/historical/*.log {
        rotate 1
      }
    owner: "root"
    group: "root"
    mode: "u=rw,g=r,o=r"


# An administrator's own drop-in (no ownership marker): the sweep must leave
# it alone even though it lives in the managed directory.
- name: "Molecule | Verify | Uninstall: plant an administrator-owned drop-in without the marker"
  ansible.builtin.copy:
    dest: "/etc/logrotate.d/admin-own"
    content: |
      # hand-made by the administrator, not Ansible
      /var/log/admin/*.log {
        rotate 1
      }
    owner: "root"
    group: "root"
    mode: "u=rw,g=r,o=r"


- name: "Molecule | Verify | Uninstall: run the role with state 'absent'"
  ansible.builtin.include_role:
    name: "foundata.logrotate.run"
  vars:
    run_logrotate_state: "absent"
    run_logrotate_config_defaults_dropin_file_name: "00-custom-dropin-defaults"


- name: "Molecule | Verify | Uninstall: check the role-managed files are gone"
  ansible.builtin.stat:
    path: "{{ item }}"
  register: __testing_uninstall_gone_stat
  failed_when:
    - __testing_uninstall_gone_stat['stat']['exists']
  loop:
    - "/etc/logrotate.d/00-custom-dropin-defaults"
    - "/etc/logrotate.d/00-defaults"
    - "/etc/logrotate.d/foo-bar"
    - "/etc/logrotate.d/renamed-historical"
    - "{{ __run_logrotate_systemd_timer_unit_dropin_file_path }}"


- name: "Molecule | Verify | Uninstall: check the administrator's drop-in survived"
  ansible.builtin.stat:
    path: "/etc/logrotate.d/admin-own"
  register: __testing_uninstall_admin_stat
  failed_when:
    - not __testing_uninstall_admin_stat['stat']['exists']


- name: "Molecule | Verify | Uninstall: remove the administrator-owned test file"
  ansible.builtin.file:
    path: "/etc/logrotate.d/admin-own"
    state: "absent"
