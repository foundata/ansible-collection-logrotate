# Configuration: Manage settings, like adapting or creating config files.

---

- name: "Config | Default | Ensure main config file exists with proper permissions"
  ansible.builtin.file:
    path: "{{ __run_logrotate_config_file_path }}"
    state: "touch"
    owner: "{{ __run_logrotate_config_file_owner }}"
    group: "{{ __run_logrotate_config_file_group }}"
    mode: "{{ __run_logrotate_config_file_mode }}"
    access_time: "preserve"
    modification_time: "preserve"


- name: "Config | Default | Ensure drop-in config directory exists with proper permissions"
  ansible.builtin.file:
    path: "{{ __run_logrotate_config_dropin_dir_path }}"
    state: "directory"
    owner: "{{ __run_logrotate_config_dropin_dir_owner }}"
    group: "{{ __run_logrotate_config_dropin_dir_group }}"
    mode: "{{ __run_logrotate_config_dropin_dir_mode }}"
  notify:
    - "run_logrotate: validate configuration"


## Defaults drop-in

- name: "Config | Default | Create drop-in config file (logrotate defaults)"
  ansible.builtin.template:
    src: "logrotate_defaults.conf.j2"
    dest: "{{ __run_logrotate_config_defaults_dropin_file_path }}"
    owner: "{{ __run_logrotate_config_dropin_file_owner }}"
    group: "{{ __run_logrotate_config_dropin_file_group }}"
    mode: "{{ __run_logrotate_config_dropin_file_mode }}"
  vars:
    # Pass (and/or adjust) variables needed for the template
    tpl_defaults_conf: "{{ run_logrotate_config_defaults }}"
  notify:
    - "run_logrotate: validate configuration"


- name: "Config | Default | Remove role's default drop-in config file (logrotate defaults) (if custom filename is used)"
  ansible.builtin.file:
    path: "{{ __run_logrotate_config_defaults_dropin_file_path_default }}"
    state: "absent"
  when:
    - __run_logrotate_config_defaults_dropin_file_path != __run_logrotate_config_defaults_dropin_file_path_default
  notify:
    - "run_logrotate: validate configuration"


## User define app-specific sections, additional drop-in files

- name: "Config | Default | Create drop-in config files"
  ansible.builtin.template:
    src: "logrotate_section.conf.j2"
    dest: "{{ __run_logrotate_config_dropin_dir_path }}/{{ __run_logrotate_loop_file_name }}"
    owner: "{{ __run_logrotate_config_dropin_file_owner }}"
    group: "{{ __run_logrotate_config_dropin_file_group }}"
    mode: "{{ __run_logrotate_config_dropin_file_mode }}"
  vars:
    __run_logrotate_loop_file_name: >-
      {{
        item['key']
        | ansible.builtin.lower
        | ansible.builtin.regex_replace('[^a-z0-9._]', '_')
        | ansible.builtin.regex_replace('_+', '_')
        | ansible.builtin.regex_replace('^_|_$', '')
      }}
    # Pass (and/or adjust) variables needed for the template
    tpl_section_conf: "{{ item['value'] }}"
  loop: >-
    {{
      run_logrotate_config_sections
      | ansible.builtin.default({})
      | ansible.builtin.dict2items
    }}
  loop_control:
    label: "{{ __run_logrotate_config_dropin_dir_path }}/{{ __run_logrotate_loop_file_name }}"
  when:
    - ((run_logrotate_config_sections | ansible.builtin.default({})) | ansible.builtin.length) > 0
  notify:
    - "run_logrotate: validate configuration"


## Cleanup: reap files this role created for keys or filenames that were
## renamed or removed. Ownership is proven by the marker line the templates
## write as first line: only files carrying it are candidates, package and
## hand-made admin files are never touched.

- name: "Config | Default | Find files in the drop-in config directory"
  ansible.builtin.find:
    paths:
      - "{{ __run_logrotate_config_dropin_dir_path }}"
    file_type: "file"
    hidden: true
  register: __run_logrotate_find_result


- name: "Config | Default | Determine stale files created by this role"
  ansible.builtin.command:
    argv: >-
      {{
        [__run_logrotate_grep_exec_path, '-l', '-s', '-x', '-F', '--', __run_logrotate_config_file_marker]
        + __run_logrotate_stale_candidates
      }}
  register: __run_logrotate_stale_result
  changed_when: false
  failed_when:
    - __run_logrotate_stale_result['rc'] not in [0, 1, 2]
  vars:
    __run_logrotate_stale_candidates: >-
      {{
        __run_logrotate_find_result['files']
        | ansible.builtin.map(attribute='path')
        | ansible.builtin.reject('ansible.builtin.in', __run_logrotate_config_managed_file_paths)
        | ansible.builtin.list
      }}
  when:
    - (__run_logrotate_stale_candidates | ansible.builtin.length) > 0


- name: "Config | Default | Remove stale files created by this role"
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  loop: "{{ __run_logrotate_stale_result['stdout_lines'] | ansible.builtin.default([]) }}"
  notify:
    - "run_logrotate: validate configuration"


- name: "Config | Default | Ensure 'Include' directive exists in main service config file"
  ansible.builtin.lineinfile:
    path: "{{ __run_logrotate_config_file_path }}"
    line: "include {{ __run_logrotate_config_dropin_dir_path }}"
    state: "present"
  when:
    # openSUSE Leap does NOT rely on an "include" directive inside the main
    # configuration file (/usr/etc/logrotate.conf). Instead, logrotate is
    # executed via /usr/sbin/logrotate-all (systemd service) which dynamically
    # loads:
    #   - /etc/logrotate.conf (if present) or /usr/etc/logrotate.conf
    #   - {/usr,}/etc/logrotate.d/*
    # Includes are handled by the wrapper script, not via an "include" directive
    # inside the main config file. Therefore we do NOT add an include directive
    # on this platform.
    #
    # More information:
    #   - cat /usr/sbin/logrotate-all (on openSUSE Leap)
    #   - systemctl cat logrotate.service (on openSUSE Leap)
    #   - systemctl cat logrotate.timer
    - (ansible_facts['distribution'] | ansible.builtin.regex_replace(' ', '_') | ansible.builtin.lower) != 'opensuse_leap'
  notify:
    - "run_logrotate: validate configuration"


## systemd timer

- name: "Config | Default | systemd timer"
  when:
    - (ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'
    - run_logrotate_timer_manage
  block:

    - name: "Config | Default | systemd timer | Ensure timer override directory exists"
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ __run_logrotate_systemd_timer_unit_name }}.d"
        state: "directory"
        owner: "{{ __run_logrotate_systemd_timer_unit_dropin_dir_owner }}"
        group: "{{ __run_logrotate_systemd_timer_unit_dropin_dir_group }}"
        mode: "{{ __run_logrotate_systemd_timer_unit_dropin_dir_mode }}"
      notify:
        - "run_logrotate: systemd daemon-reload"

    - name: "Config | Default | systemd timer | Create drop-in config file"
      ansible.builtin.template:
        src: "systemd_timer.conf.j2"
        dest: "{{ __run_logrotate_systemd_timer_unit_dropin_file_path }}"
        owner: "{{ __run_logrotate_systemd_timer_unit_dropin_file_owner }}"
        group: "{{ __run_logrotate_systemd_timer_unit_dropin_file_group }}"
        mode: "{{ __run_logrotate_systemd_timer_unit_dropin_file_mode }}"
      vars:
        # Pass (and/or adjust) variables needed for the template
        tpl_timer_settings: "{{ __run_logrotate_effective_timer_settings }}"
      notify:
        - "run_logrotate: systemd daemon-reload"


- name: "Config | Default | Remove managed systemd timer drop-in when timer management is disabled"
  ansible.builtin.file:
    path: "{{ __run_logrotate_systemd_timer_unit_dropin_file_path }}"
    state: "absent"
  when:
    - (ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'
    - not run_logrotate_timer_manage
  notify:
    - "run_logrotate: systemd daemon-reload"


- name: "Config | Default | Warn about unsupported service manager for timer configuration"
  ansible.builtin.debug:
    msg: >-
      Timer management is only supported with systemd as service manager.
      The current service manager '{{ ansible_facts['service_mgr'] }}' is not supported.
      The automatic logrotate scheduling will use the platform's defaults (e.g., cron).
  when:
    - (ansible_facts['service_mgr'] | ansible.builtin.lower) != 'systemd'
    - run_logrotate_timer_manage
