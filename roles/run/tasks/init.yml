# Initialization: Manage internal role setup and the Ansible environment.

---

- name: "Init | Gather role-specific facts"
  ansible.builtin.setup:
    gather_subset: "{{ __run_logrotate_used_facts.keys() | ansible.builtin.list }}"
  when:
    - not ((__run_logrotate_used_facts.values() | ansible.builtin.flatten)
           is ansible.builtin.subset(ansible_facts.keys()))


- name: "Init | Include role meta data"
  ansible.builtin.include_vars:
    file: "../meta/main.yml"
    name: "__run_logrotate_meta"


- name: "Init | Check Ansible version requirement and fail if unmet"
  ansible.builtin.fail:
    msg: >
      This role requires Ansible {{ __run_logrotate_meta['galaxy_info']['min_ansible_version'] }}
      or higher. You are currently running Ansible {{ ansible_version['full'] }} .
  when:
    - ansible_version['full'] is version_compare(__run_logrotate_meta['galaxy_info']['min_ansible_version'], '<')


- name: "Init | Notify when platform support check is not possible"
  ansible.builtin.debug:
    msg: >
      The list of supported platforms cannot be checked as it is either empty
      or distribution facts are missing.
    verbosity: 1
  when:
    - ansible_facts['os_family'] is not ansible.builtin.defined or
      ansible_facts['distribution'] is not ansible.builtin.defined or
      ansible_facts['distribution_version'] is not ansible.builtin.defined or
      ansible_facts['distribution_major_version'] is not ansible.builtin.defined or
      ((__run_logrotate_supported_platforms | ansible.builtin.length) == 0)


- name: "Init | Warn when platform is unsupported"
  ansible.builtin.fail:
    msg: >
      Neither {{ ansible_facts['distribution'] }} (distribution) nor {{ ansible_facts['os_family'] }} (os_family)
      with versions '{{ ansible_facts['distribution_major_version'] }}', '{{ ansible_facts['distribution_version'] }}',
      or 'all' is in the list of supported platforms from vars/main.yml: {{ __run_logrotate_supported_platforms }}
  vars:
    __run_logrotate_platform_names_regex: >-
      ^({{ ansible_facts['distribution'] }}|{{ ansible_facts['os_family'] }})$
    __run_logrotate_platform_versions_regex: >-
      ^({{ ansible_facts['distribution_major_version'] }}|{{ ansible_facts['distribution_version'] }}|all)$
    __run_logrotate_matched_versions: >-
      {{
        __run_logrotate_supported_platforms
        | ansible.builtin.selectattr('name', 'match', __run_logrotate_platform_names_regex, ignorecase=true)
        | ansible.builtin.map(attribute='versions')
        | ansible.builtin.flatten
        | ansible.builtin.select('match', __run_logrotate_platform_versions_regex, ignorecase=true)
        | ansible.builtin.list
      }}
  when:
    - (__run_logrotate_supported_platforms | ansible.builtin.length) > 0
    - (__run_logrotate_matched_versions | ansible.builtin.length) == 0
  ignore_errors: true # noqa: ignore-errors


- name: "Init | Set platform-specific filename list (most to least specific; raw with possible duplicates)"
  ansible.builtin.set_fact:
    __run_logrotate_platform_filenames_raw:
      - "{{ __run_logrotate_dist }}_{{ __run_logrotate_dist_ver }}.yml"
      - "{{ __run_logrotate_dist }}_{{ __run_logrotate_dist_major }}.yml"
      - "{{ __run_logrotate_dist }}.yml"
      - "{{ __run_logrotate_os_family }}.yml"
  vars:
    __run_logrotate_dist: >-
      {{
        ansible_facts['distribution']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __run_logrotate_dist_ver: >-
      {{
        ansible_facts['distribution_version']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __run_logrotate_dist_major: >-
      {{
        ansible_facts['distribution_major_version']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __run_logrotate_os_family: >-
      {{
        ansible_facts['os_family']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}


- name: "Init | Set unique platform-specific filename list (most to least specific)"
  ansible.builtin.set_fact:
    __run_logrotate_platform_filenames_most_specific_first: >-
      {{
        (__run_logrotate_platform_filenames_raw
        | ansible.builtin.unique
        | ansible.builtin.default([]))
      }}


- name: "Init | Set unique platform-specific filename list (least to most specific)"
  ansible.builtin.set_fact:
    __run_logrotate_platform_filenames_most_specific_last: >-
      {{
        __run_logrotate_platform_filenames_most_specific_first
        | ansible.builtin.reverse
      }}


- name: "Init | Include platform-specific variables (if any), overwrite values with more specific ones"
  ansible.builtin.include_vars:
    file: "{{ __run_logrotate_vars_file }}"
  vars:
    __run_logrotate_vars_file: "{{ role_path }}/vars/{{ item }}"
  when:
    - __run_logrotate_vars_file is ansible.builtin.file
  loop: "{{ __run_logrotate_platform_filenames_most_specific_last }}"


### logrotate specific


- name: "Init | Show effective merged variables (computed lazily in vars/main.yml)"
  ansible.builtin.debug:
    msg: "{{ __run_logrotate_effective_var }} = {{ lookup('ansible.builtin.vars', __run_logrotate_effective_var) }}"
    verbosity: 3
  loop:
    - "__run_logrotate_effective_timer_settings"
  loop_control:
    loop_var: "__run_logrotate_effective_var"
    label: "{{ __run_logrotate_effective_var }}"


# Section keys are normalized into drop-in filenames. Unlike fail2ban filter
# names these are opaque (logrotate reads the whole directory), so the key does
# not have to survive normalization unchanged. It must however still yield a
# non-empty and unique basename: a key consisting only of separators collapses
# to an empty name, and two keys differing only in case or in characters that
# get replaced end up in the same file, silently overwriting each other.
- name: "Init | Assert drop-in section names yield unique, non-empty filenames"
  ansible.builtin.assert:
    that:
      - __run_logrotate_section_filenames | ansible.builtin.select('equalto', '') | ansible.builtin.list | ansible.builtin.length == 0
      - (__run_logrotate_section_filenames | ansible.builtin.length)
        == (__run_logrotate_section_filenames | ansible.builtin.unique | ansible.builtin.length)
    fail_msg: >-
      The keys of 'run_logrotate_config_sections' do not map to unique, non-empty drop-in
      filenames. They are normalized to lowercase and every character outside 'a-z0-9._' is
      replaced, so keys that differ only in case or in such characters collide and would
      overwrite each other. Normalized names: {{ __run_logrotate_section_filenames }}.
    success_msg: >-
      All keys of 'run_logrotate_config_sections' map to unique, non-empty drop-in filenames.
  vars:
    __run_logrotate_section_filenames: >-
      {{
        (run_logrotate_config_sections | ansible.builtin.default({})).keys()
        | ansible.builtin.map('ansible.builtin.lower')
        | ansible.builtin.map('ansible.builtin.regex_replace', '[^a-z0-9._]', '_')
        | ansible.builtin.map('ansible.builtin.regex_replace', '_+', '_')
        | ansible.builtin.map('ansible.builtin.regex_replace', '^_|_$', '')
        | ansible.builtin.list
      }}
  when:
    - ((run_logrotate_config_sections | ansible.builtin.default({})) | ansible.builtin.length) > 0
