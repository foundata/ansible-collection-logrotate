# Initialization: Manage internal role setup and the Ansible environment.

---

- name: "Init | Gather role-specific facts"
  ansible.builtin.setup:
    gather_subset: "{{ __run_logrotate_used_facts.keys() | ansible.builtin.list }}"
  when:
    - not ((__run_logrotate_used_facts.values() | ansible.builtin.flatten)
           is ansible.builtin.subset(ansible_facts.keys()))


- name: "Init | Include role meta data"
  ansible.builtin.include_vars:
    file: "../meta/main.yml"
    name: "__run_logrotate_meta"


- name: "Init | Check Ansible version requirement and fail if unmet"
  ansible.builtin.fail:
    msg: >
      This role requires Ansible {{ __run_logrotate_meta['galaxy_info']['min_ansible_version'] }}
      or higher. You are currently running Ansible {{ ansible_version['full'] }} .
  when:
    - ansible_version['full'] is version_compare(__run_logrotate_meta['galaxy_info']['min_ansible_version'], '<')


- name: "Init | Notify when platform support check is not possible"
  ansible.builtin.debug:
    msg: >
      The list of supported platforms cannot be checked as it is either empty
      or distribution facts are missing.
    verbosity: 1
  when:
    - ansible_facts['os_family'] is not ansible.builtin.defined or
      ansible_facts['distribution'] is not ansible.builtin.defined or
      ansible_facts['distribution_version'] is not ansible.builtin.defined or
      ansible_facts['distribution_major_version'] is not ansible.builtin.defined or
      ((__run_logrotate_supported_platforms | ansible.builtin.length) == 0)


- name: "Init | Warn when platform is unsupported"
  ansible.builtin.fail:
    msg: >
      Neither {{ ansible_facts['distribution'] }} (distribution) nor {{ ansible_facts['os_family'] }} (os_family)
      with versions '{{ ansible_facts['distribution_major_version'] }}', '{{ ansible_facts['distribution_version'] }}',
      or 'all' is in the list of supported platforms from vars/main.yml: {{ __run_logrotate_supported_platforms }}
  vars:
    __run_logrotate_platform_names_regex: >-
      ^({{ ansible_facts['distribution'] }}|{{ ansible_facts['os_family'] }})$
    __run_logrotate_platform_versions_regex: >-
      ^({{ ansible_facts['distribution_major_version'] }}|{{ ansible_facts['distribution_version'] }}|all)$
    __run_logrotate_matched_versions: >-
      {{
        __run_logrotate_supported_platforms
        | ansible.builtin.selectattr('name', 'match', __run_logrotate_platform_names_regex, ignorecase=true)
        | ansible.builtin.map(attribute='versions')
        | ansible.builtin.flatten
        | ansible.builtin.select('match', __run_logrotate_platform_versions_regex, ignorecase=true)
        | ansible.builtin.list
      }}
  when:
    - (__run_logrotate_supported_platforms | ansible.builtin.length) > 0
    - (__run_logrotate_matched_versions | ansible.builtin.length) == 0
  ignore_errors: true # noqa: ignore-errors


- name: "Init | Set platform-specific filename list (most to least specific; raw with possible duplicates)"
  ansible.builtin.set_fact:
    __run_logrotate_platform_filenames_raw:
      - "{{ __run_logrotate_dist }}_{{ __run_logrotate_dist_ver }}.yml"
      - "{{ __run_logrotate_dist }}_{{ __run_logrotate_dist_major }}.yml"
      - "{{ __run_logrotate_dist }}.yml"
      - "{{ __run_logrotate_os_family }}.yml"
  vars:
    __run_logrotate_dist: >-
      {{
        ansible_facts['distribution']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __run_logrotate_dist_ver: >-
      {{
        ansible_facts['distribution_version']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __run_logrotate_dist_major: >-
      {{
        ansible_facts['distribution_major_version']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __run_logrotate_os_family: >-
      {{
        ansible_facts['os_family']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}


- name: "Init | Set unique platform-specific filename list (most to least specific)"
  ansible.builtin.set_fact:
    __run_logrotate_platform_filenames_most_specific_first: >-
      {{
        (__run_logrotate_platform_filenames_raw
        | ansible.builtin.unique
        | ansible.builtin.default([]))
      }}


- name: "Init | Set unique platform-specific filename list (least to most specific)"
  ansible.builtin.set_fact:
    __run_logrotate_platform_filenames_most_specific_last: >-
      {{
        __run_logrotate_platform_filenames_most_specific_first
        | ansible.builtin.reverse
      }}


- name: "Init | Include platform-specific variables (if any), overwrite values with more specific ones"
  ansible.builtin.include_vars:
    file: "{{ __run_logrotate_vars_file }}"
  vars:
    __run_logrotate_vars_file: "{{ role_path }}/vars/{{ item }}"
  when:
    - __run_logrotate_vars_file is ansible.builtin.file
  loop: "{{ __run_logrotate_platform_filenames_most_specific_last }}"


### logrotate specific


- name: "Init | Show effective merged variables (computed lazily in vars/main.yml)"
  ansible.builtin.debug:
    msg: "{{ __run_logrotate_effective_var }} = {{ lookup('ansible.builtin.vars', __run_logrotate_effective_var) }}"
    verbosity: 3
  loop:
    - "__run_logrotate_effective_timer_settings"
  loop_control:
    loop_var: "__run_logrotate_effective_var"
    label: "{{ __run_logrotate_effective_var }}"


# Section keys are normalized into drop-in filenames. Unlike fail2ban filter
# names these are opaque (logrotate reads the whole directory), so the key does
# not have to survive normalization unchanged. It must however still yield a
# non-empty and unique basename: a key consisting only of separators collapses
# to an empty name, and two keys differing only in case or in characters that
# get replaced end up in the same file, silently overwriting each other.
- name: "Init | Assert drop-in section names yield unique, non-empty filenames"
  ansible.builtin.assert:
    that:
      - __run_logrotate_section_filenames | ansible.builtin.select('equalto', '') | ansible.builtin.list | ansible.builtin.length == 0
      - (__run_logrotate_section_filenames | ansible.builtin.length)
        == (__run_logrotate_section_filenames | ansible.builtin.unique | ansible.builtin.length)
    fail_msg: >-
      The keys of 'run_logrotate_config_sections' do not map to unique, non-empty drop-in
      filenames. They are normalized to lowercase and every character outside 'a-z0-9._' is
      replaced, so keys that differ only in case or in such characters collide and would
      overwrite each other. Normalized names: {{ __run_logrotate_section_filenames }}.
    success_msg: >-
      All keys of 'run_logrotate_config_sections' map to unique, non-empty drop-in filenames.
  vars:
    __run_logrotate_section_filenames: "{{ __run_logrotate_config_section_file_names }}"
  when:
    - ((run_logrotate_config_sections | ansible.builtin.default({})) | ansible.builtin.length) > 0


# The timer templates accept the following values per directive. The six
# repeatable trigger directives take a non-empty string, a number (except
# OnCalendar, which takes calendar expression strings) or a list of such
# values; an empty list is the supported way to drop the role's built-in
# default for that directive (e.g. to run a purely monotonic timer without a
# calendar schedule). The boolean event trigger directives OnClockChange and
# OnTimezoneChange take true or false, and a true value counts as a trigger,
# so an event-only timer is a valid configuration. Every other directive takes
# a single scalar. Everything else - mappings, null, booleans or empty strings
# for repeatable triggers, non-booleans for event triggers, unusable list
# members, lists for non-repeatable directives - would be stringified into an
# invalid systemd value or produce an enabled timer without any trigger, so it
# is rejected here instead of silently mis-rendered.
- name: "Init | Assert the timer settings use supported value types"
  ansible.builtin.assert:
    that:
      - (__run_logrotate_timer_value_offenders_0 | ansible.builtin.length) == 0
    fail_msg: >-
      Unsupported timer setting value(s):
      {{ (__run_logrotate_timer_value_offenders_0) | ansible.builtin.join(', ') }}.
      Repeatable trigger directives
      ({{ __run_logrotate_timer_trigger_directives | ansible.builtin.join(', ') }})
      take a non-empty string, a number (except OnCalendar) or a list of such
      values (an empty list drops the built-in default); the event trigger
      directives
      ({{ __run_logrotate_timer_event_trigger_directives | ansible.builtin.join(', ') }})
      take true or false; all other directives take a single scalar.
    success_msg: "All timer settings use supported value types."
  vars:
    __run_logrotate_timer_trigger_directives:
      - "OnCalendar"
      - "OnActiveSec"
      - "OnBootSec"
      - "OnStartupSec"
      - "OnUnitActiveSec"
      - "OnUnitInactiveSec"
    __run_logrotate_timer_event_trigger_directives:
      - "OnClockChange"
      - "OnTimezoneChange"
    __run_logrotate_timer_value_offenders_0: >-
      {%- set ns = namespace(items=[]) -%}
      {%- for k, v in (__run_logrotate_effective_timer_settings | ansible.builtin.default({})).items() -%}
      {%-   set is_seq = (v is ansible.builtin.iterable)
                          and (v is not ansible.builtin.string)
                          and (v is not ansible.builtin.mapping) -%}
      {%-   if k in __run_logrotate_timer_event_trigger_directives -%}
      {%-     if v is not ansible.builtin.boolean -%}
      {%-       set _ = ns.items.append(k ~ " (takes true or false)") -%}
      {%-     endif -%}
      {%-   elif k not in __run_logrotate_timer_trigger_directives -%}
      {%-     if is_seq or (v is ansible.builtin.mapping) or (v is none) -%}
      {%-       set _ = ns.items.append(k ~ " (takes a single scalar value)") -%}
      {%-     endif -%}
      {%-   elif (v is ansible.builtin.boolean) or (v is ansible.builtin.mapping) or (v is none) -%}
      {%-     set _ = ns.items.append(k ~ " (takes a non-empty string or a list of them)") -%}
      {%-   elif (v is ansible.builtin.string) and ((v | ansible.builtin.trim | ansible.builtin.length) == 0) -%}
      {%-     set _ = ns.items.append(k ~ " (empty string; use an empty list to drop the built-in default)") -%}
      {%-   elif (v is ansible.builtin.number) and (k == 'OnCalendar') -%}
      {%-     set _ = ns.items.append(k ~ " (takes a calendar expression string)") -%}
      {%-   elif is_seq -%}
      {%-     for e in v -%}
      {%-       set e_seq = (e is ansible.builtin.iterable) and (e is not ansible.builtin.string) -%}
      {%-       if (e is ansible.builtin.boolean) or e_seq or (e is none)
                    or ((e is ansible.builtin.string) and ((e | ansible.builtin.trim | ansible.builtin.length) == 0))
                    or ((e is ansible.builtin.number) and (k == 'OnCalendar')) -%}
      {%-         set _ = ns.items.append(k ~ " (list entry " ~ loop.index ~ " is not a usable trigger value)") -%}
      {%-       endif -%}
      {%-     endfor -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ ns.items }}


# Mirrors the conditions under which the logrotate timer is actually managed in the
# config tasks, so settings the role will not render are not rejected.
- name: "Init | Assert the logrotate timer keeps at least one trigger"
  ansible.builtin.assert:
    that:
      - __run_logrotate_timer_update_has_trigger | ansible.builtin.bool
    fail_msg: >-
      The merged timer settings for the logrotate timer configure no trigger at all
      (e.g. every repeatable trigger was dropped via an empty list and no event
      trigger is true). The timer would be enabled but never fire; configure at
      least one trigger.
    success_msg: "The logrotate timer keeps at least one trigger."
  vars:
    __run_logrotate_timer_trigger_directives:
      - "OnCalendar"
      - "OnActiveSec"
      - "OnBootSec"
      - "OnStartupSec"
      - "OnUnitActiveSec"
      - "OnUnitInactiveSec"
    __run_logrotate_timer_event_trigger_directives:
      - "OnClockChange"
      - "OnTimezoneChange"
    __run_logrotate_timer_update_has_trigger: >-
      {%- set ns = namespace(found=false) -%}
      {%- for k, v in (__run_logrotate_effective_timer_settings | ansible.builtin.default({})).items() -%}
      {%-   if k in __run_logrotate_timer_trigger_directives -%}
      {%-     set is_seq = (v is ansible.builtin.iterable)
                            and (v is not ansible.builtin.string)
                            and (v is not ansible.builtin.mapping) -%}
      {%-     if is_seq -%}
      {%-       if (v | ansible.builtin.length) > 0 -%}{%- set ns.found = true -%}{%- endif -%}
      {%-     elif (v is ansible.builtin.string) -%}
      {%-       if (v | ansible.builtin.trim | ansible.builtin.length) > 0 -%}{%- set ns.found = true -%}{%- endif -%}
      {%-     elif (v is ansible.builtin.number) and (v is not ansible.builtin.boolean) -%}
      {%-       set ns.found = true -%}
      {%-     endif -%}
      {%-   elif (k in __run_logrotate_timer_event_trigger_directives)
                 and (v is ansible.builtin.boolean) and v -%}
      {%-     set ns.found = true -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ ns.found }}
  when:
    - (ansible_facts['service_mgr'] | ansible.builtin.lower) == 'systemd'
    - run_logrotate_timer_manage | ansible.builtin.bool
