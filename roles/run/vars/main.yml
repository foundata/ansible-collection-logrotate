# Internal role variables and values that must NOT be overridden by the user.
#
# Variables defined here usually dropin earlier definitions due to the high
# precedence of this file. Each variable should have a concise comment above
# it, describing its purpose and how it fits into the role's functionality.

---

# Facts used by the role (gathered on a best-effort basis if needed), as a
# mapping of "gather_subset" name to the ansible_facts keys it provides.
#
# To identify which subset a fact belongs to during development, you can use
# the following snippet:
#
# - ansible.builtin.setup:
#     gather_subset:
#       - '!min'
#       - '<subset_name, see parameter doc for details>'
__run_logrotate_used_facts:
  distribution:
    - "distribution"
    - "distribution_major_version"
    - "distribution_version"
    - "os_family"
  # ansible_facts['service_mgr']; needed under reduced fact sets.
  service_mgr:
    - "service_mgr"


# List of platforms this role supports and was designed for.
#
# A warning will be issued if the list contains values and the role is executed
# on an unknown (not listed) platform, but execution will continue. Example:
#
# - name: "Fedora" # A ansible_facts value ('distribution' or 'os_family')
#   versions: # A ansible_facts value ('distribution_major_version' or
#     - "all" # 'distribution_version') or "all"
# - name: "Ubuntu"
#   versions:
#     - "22.04"
#     - "24.04"
# - name: "RedHat"
#   versions:
#     - "all"
# - name: "Debian"
#   versions:
#     - "all"
__run_logrotate_supported_platforms:
  - name: "Debian"
    versions:
      - "12"
      - "13"
  - name: "Fedora"
    versions:
      - "43"
      - "44"
  - name: "openSUSE Leap"
    versions:
      - "16.0"
  - name: "RedHat" # includes AlmaLinux, Rocky and CentOS Stream
    versions:
      - "9"
      - "10"
  - name: "Ubuntu"
    versions:
      - "22.04"
      - "24.04"
      - "26.04"


# List of package names to be installed when run_logrotate_state is
# set to "present".
__run_logrotate_packages_install:
  - "logrotate"


# List of package names to be uninstalled when run_logrotate_state is
# set to "absent". This variable is useful when __run_logrotate_packages_install
# contains packages that are required for the managed software to function but
# should not be removed during uninstallation, as doing so could break other
# software. This is usually the case if there are common dependencies like
# "curl" or "openssl" which typically should remain installed even after
# uninstalling the software managed by this role.
__run_logrotate_packages_uninstall: "{{ __run_logrotate_packages_install }}"


# List of package names to be removed unconditionally before installation
# (e.g., to prevent conflicts or resolve incompatibilities).
__run_logrotate_packages_removal: []


# List of paths of files and directories to be removed unconditionally after
# installation. This is useful for removing default configuration resources
# that would otherwise create confusion or conflict with custom configurations
# managed by this role.
__run_logrotate_paths_removal: []


# Dictionary of files to be overwritten with a managed comment instead of being
# deleted. Keys are file paths; values are the single-line comment characters to
# use. This is needed on platforms where the package manager reinstalls deleted
# files on package update. Restored files would conflict with the managed
# configuration, while modified files are preserved. For example, RPM with
# %config(noreplace) restores missing files but preserves modified ones.
__run_logrotate_paths_neutralize: {}


# Additional default configuration for the logrotate timer.
#
# See run_logrotate_timer_settings in defaults/main.yml for a detailed
# description of the structure (as this variable is using the same).
__run_logrotate_timer_settings_defaults:
  OnCalendar: "daily"
  RandomizedDelaySec: "1h"
  Persistent: true


# Effective logrotate timer settings: the defaults above with the user-supplied
# run_logrotate_timer_settings merged on top. systemd directives are
# case-sensitive, as are Ansible dict keys, so a plain combine() lets user
# values override defaults without extra handling.
#
# Lazy / late-bound evaluation: Jinja renders this variable on access,
# after tasks/init.yml loads the platform vars file that sets the inputs.
__run_logrotate_effective_timer_settings: >-
  {{
    __run_logrotate_timer_settings_defaults
    | ansible.builtin.combine(run_logrotate_timer_settings)
  }}


# Configuration file paths, ownership, and permissions. These variables define
# the different locations of configuration files, include directories, and
# Ansible-managed files, ensuring consistent file handling across distributions.
__run_logrotate_config_file_path: "/etc/logrotate.conf"
__run_logrotate_config_file_owner: "root"
__run_logrotate_config_file_group: "root"
__run_logrotate_config_file_mode: "u=rw,g=r,o=r" # 0644

__run_logrotate_config_dropin_dir_path: "/etc/logrotate.d"
__run_logrotate_config_dropin_dir_owner: "{{ __run_logrotate_config_file_owner }}"
__run_logrotate_config_dropin_dir_group: "{{ __run_logrotate_config_file_group }}"
__run_logrotate_config_dropin_dir_mode: "u=rwx,g=rx,o=rx" # 0755

__run_logrotate_config_dropin_file_owner: "{{ __run_logrotate_config_file_owner }}"
__run_logrotate_config_dropin_file_group: "{{ __run_logrotate_config_file_group }}"
__run_logrotate_config_dropin_file_mode: "{{ __run_logrotate_config_file_mode }}"

__run_logrotate_config_defaults_dropin_file_path: "{{ __run_logrotate_config_dropin_dir_path }}/{{ run_logrotate_config_defaults_dropin_file_name }}"
__run_logrotate_config_defaults_dropin_file_path_default: "{{ __run_logrotate_config_dropin_dir_path }}/00-defaults" # needed to detect non-default names

# Ownership marker, written as the first line of every file this role creates
# in the shared drop-in directory. Load-bearing for the cleanup logic: only
# files carrying this exact line are ever removed, files without it (package
# or hand-made admin files) are never touched.
__run_logrotate_config_file_marker: "# Managed by Ansible (foundata.logrotate.run)"

# Drop-in basenames derived from the section keys. init.yml asserts the
# normalization yields unique, non-empty names.
__run_logrotate_config_section_file_names: >-
  {{
    (run_logrotate_config_sections | ansible.builtin.default({})).keys()
    | ansible.builtin.map('ansible.builtin.lower')
    | ansible.builtin.map('ansible.builtin.regex_replace', '[^a-z0-9._]', '_')
    | ansible.builtin.map('ansible.builtin.regex_replace', '_+', '_')
    | ansible.builtin.map('ansible.builtin.regex_replace', '^_|_$', '')
    | ansible.builtin.list
  }}

# Files currently declared through role variables, kept by the cleanup logic.
__run_logrotate_config_managed_file_paths: >-
  {{
    [__run_logrotate_config_defaults_dropin_file_path]
    + (__run_logrotate_config_section_file_names
       | ansible.builtin.map('ansible.builtin.regex_replace', '^', __run_logrotate_config_dropin_dir_path ~ '/')
       | ansible.builtin.list)
  }}


# Paths of executables for management and validation.
__run_logrotate_logrotate_exec_path: "/usr/sbin/logrotate"
__run_logrotate_grep_exec_path: "/usr/bin/grep"


# systemd logrotate timer (helpful: systemctl cat logrotate.timer)
__run_logrotate_systemd_timer_unit_name: "logrotate.timer"

__run_logrotate_systemd_timer_unit_dropin_dir_path: "/etc/systemd/system/{{ __run_logrotate_systemd_timer_unit_name }}.d"
__run_logrotate_systemd_timer_unit_dropin_dir_owner: "{{ __run_logrotate_config_file_owner }}"
__run_logrotate_systemd_timer_unit_dropin_dir_group: "{{ __run_logrotate_config_file_group }}"
__run_logrotate_systemd_timer_unit_dropin_dir_mode: "{{ __run_logrotate_config_dropin_dir_mode }}"

__run_logrotate_systemd_timer_unit_dropin_file_path: "{{ __run_logrotate_systemd_timer_unit_dropin_dir_path }}/00-managed.conf"
__run_logrotate_systemd_timer_unit_dropin_file_owner: "{{ __run_logrotate_config_file_owner }}"
__run_logrotate_systemd_timer_unit_dropin_file_group: "{{ __run_logrotate_config_file_group }}"
__run_logrotate_systemd_timer_unit_dropin_file_mode: "{{ __run_logrotate_config_file_mode }}"


### Override defaults of dependencies used by this role (if any).

# nothing right now
